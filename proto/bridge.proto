syntax = "proto3";

package pocketbridge.v1;

option go_package = "github.com/cagedbird043/pocket-bridge/gen/go/pocketbridge/v1;pocketbridgev1";

message Envelope {
  string id = 1;
  string from_device_id = 2;
  string to_device_id = 3;
  int64 unix_ms = 4;
  oneof payload {
    DeviceHello device_hello = 10;
    NotifyPush notify_push = 11;
    ClipboardPush clipboard_push = 13;
    ClipboardPull clipboard_pull = 14;
    ClipboardValue clipboard_value = 15;
    FileOffer file_offer = 16;
    FileChunk file_chunk = 17;
    FileDone file_done = 18;
    TaskStatus task_status = 19;
    Ack ack = 20;
    Error error = 21;
  }
}

message DeviceHello {
  string device_id = 1;
  string device_type = 2;
  string protocol_version = 3;
}

message NotifyPush {
  string title = 1;
  string body = 2;
  string topic = 3;
  string priority = 4;
}

message ClipboardPush {
  string mime_type = 1;
  string text = 2;
}

message ClipboardPull {
  string preferred_mime_type = 1;
}

message ClipboardValue {
  string mime_type = 1;
  string text = 2;
}

message FileOffer {
  string file_name = 1;
  string mime_type = 2;
  uint64 size_bytes = 3;
  string transfer_id = 4;
}

message FileChunk {
  string transfer_id = 1;
  bytes data = 2;
  uint64 offset = 3;
}

message FileDone {
  string transfer_id = 1;
  uint64 size_bytes = 2;
  string sha256_hex = 3;
}

message TaskStatus {
  string kind = 1;
  string title = 2;
  string summary = 3;
}

message Ack {
  string ack_id = 1;
}

message Error {
  string code = 1;
  string message = 2;
}
